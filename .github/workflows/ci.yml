name: IPXDR CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q backend ml replay benchmarks scripts
      - run: git diff --check
      - run: pytest -q
      - run: python benchmarks/throughput.py -n 2000 --json
      - run: python benchmarks/unknown_threat.py

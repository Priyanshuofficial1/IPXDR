<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>IPXDR SOC</title><style>body{margin:0;background:#070a0f;color:#e8eef5;font:14px system-ui}main{max-width:1200px;margin:auto;padding:32px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#0e141c;border:1px solid #202b38;border-radius:14px;padding:18px}.num{font-size:28px;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{text-align:left;padding:12px;border-bottom:1px solid #202b38}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main><h1>IPXDR</h1><p>Passive Network Detection & Response</p><div class="grid"><div class="card">Flows<div class="num" id="flows">—</div></div><div class="card">Alerts<div class="num" id="alerts">—</div></div><div class="card">Failed<div class="num" id="failed">—</div></div><div class="card">Mode<div class="num">PASSIVE</div></div></div><div class="card" style="margin-top:20px"><h2>Live Alerts</h2><table><thead><tr><th>Time</th><th>Threat</th><th>Severity</th><th>Confidence</th><th>Evidence</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>async function refresh(){try{let m=await fetch('/metrics').then(r=>r.json()),a=await fetch('/alerts').then(r=>r.json());flows.textContent=m.accepted;alerts.textContent=m.alerts;failed.textContent=m.failed;rows.innerHTML=a.map(x=>`<tr><td>${new Date(x.timestamp).toLocaleTimeString()}</td><td>${x.threat_class}</td><td>${x.severity}</td><td>${(x.confidence*100).toFixed(1)}%</td><td>${x.supporting_evidence.join(' · ')}</td></tr>`).join('')}catch(e){}}refresh();setInterval(refresh,2000)</script></body></html>

[project]
name="ipxdr"
version="0.4.0"
description="Passive, self-adapting AI threat detection for unidirectional IP traffic"
requires-python=">=3.11"
dependencies=["pydantic>=2.7","fastapi>=0.115","uvicorn>=0.30","scapy>=2.6","numpy>=1.26","scikit-learn>=1.5","joblib>=1.4"]
[project.optional-dependencies]
test=["pytest>=8.0","httpx>=0.27"]
[tool.setuptools.packages.find]
include=["backend*","ml*","replay*"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
